# Cloudflare Worker configuration for MeteoricCraft live status
#
# Setup:
#   1. npx wrangler login
#   2. npx wrangler kv namespace create MC_STATUS_CACHE
#      → paste the returned ID into kv_namespaces.id below
#   3. Set MC_HOST and MC_PORT in [vars] below to your real values
#   4. npx wrangler deploy

name = "merric-mc-status"
main = "src/index.js"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The public address of the Minecraft server.
# Should match the playit.gg tunnel hostname OR mc.merricstrough.com once DNS is set.
MC_HOST = "mc.merricstrough.com"
MC_PORT = "25565"

[[kv_namespaces]]
binding = "MC_STATUS_CACHE"
id = "4d5c25def3c744f5a622ebed6ec85eef"

# Cron — warm the cache every minute so first visitor doesn't wait
[triggers]
crons = ["* * * * *"]

# Resource limits (Cloudflare default is fine; documented for clarity)
# CPU time: 50ms (subrequest budget more than enough for one TCP roundtrip)

[observability]
enabled = true
