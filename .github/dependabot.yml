# Dependabot configuration — merric-minecraft
#
# Mirrors the merricstrough.com repo's weekly-grouped-patches pattern (per
# master CLAUDE.md §6.2). The only ecosystem with package-managed deps in this
# repo is the worker/ Cloudflare Worker (npm). Docker base images are tracked
# separately (itzg/minecraft-server:java21 and ghcr.io/playit-cloud/playit-agent
# in docker-compose.yml).
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Cloudflare Worker (status widget backend)
  - package-ecosystem: "npm"
    directory: "/worker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      worker-deps:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "worker"

  # Docker base images (itzg/minecraft-server, playit agent)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions (none yet, but enable so future workflows are covered)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
