# Dependabot configuration — merric-minecraft
#
# Mirrors the merricstrough.com repo's weekly-grouped-patches pattern (per
# master CLAUDE.md §6.2). After ADR-0009 removed the worker dir, this repo
# has no npm ecosystem of its own. The Docker base images and GitHub Actions
# are still worth tracking.
#
# Reference: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Docker base images (itzg/minecraft-server, playit agent)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  # GitHub Actions (none yet, but enable so future workflows are covered)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
