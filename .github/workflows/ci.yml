name: ci

# Two independent jobs that validate the things this repo can break:
#   1. shellcheck — scripts/{ops,backup,restore}.sh run on the Ubuntu host
#   2. compose-validate — docker-compose.yml is parseable + structurally valid
#
# Intentionally light. We don't deploy from CI — the server is on a home
# workstation, not CI-reachable. Real validation of the server stack happens
# in the manual smoke tests in CLAUDE.md §Testing. The status widget worker
# lives in the website repo and has its own CI (per ADR-0009).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save Action minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Opt into Node.js 24 for action runtimes (actions/checkout, actions/setup-node).
# GitHub forces this on 2026-06-02; setting it now silences deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck scripts/
        run: shellcheck --severity=warning scripts/*.sh

  compose-validate:
    name: docker-compose validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: validate docker-compose.yml
        # Stub values for required env vars — compose config only parses the
        # file, doesn't actually pull images or run anything.
        env:
          WHITELIST: ci-stub
          OPS: ci-stub
          RCON_PASSWORD: ci-stub-password-not-real
          PLAYIT_SECRET_KEY: ci-stub
          BLUEMAP_WEBSERVER_PASSWORD: ci-stub
        run: docker compose config --quiet

