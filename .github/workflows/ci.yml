name: ci

# Three independent jobs that validate the things this repo can break:
#   1. shellcheck — scripts/{ops,backup,restore}.sh run on the Ubuntu host
#   2. compose-validate — docker-compose.yml is parseable + structurally valid
#   3. worker-smoke — wrangler 4.x boots under Node 22 (the new minimum)
#
# Intentionally light. We don't deploy from CI (worker deploy is interactive;
# server is on a home workstation, not CI-reachable). Real validation of the
# server stack happens in the manual smoke tests in CLAUDE.md §Testing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save Action minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Opt into Node.js 24 for action runtimes (actions/checkout, actions/setup-node).
# GitHub forces this on 2026-06-02; setting it now silences deprecation warnings.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: shellcheck scripts/
        run: shellcheck --severity=warning scripts/*.sh

  compose-validate:
    name: docker-compose validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: validate docker-compose.yml
        # Stub values for required env vars — compose config only parses the
        # file, doesn't actually pull images or run anything.
        env:
          WHITELIST: ci-stub
          OPS: ci-stub
          RCON_PASSWORD: ci-stub-password-not-real
          PLAYIT_SECRET_KEY: ci-stub
          BLUEMAP_WEBSERVER_PASSWORD: ci-stub
        run: docker compose config --quiet

  worker-smoke:
    name: worker smoke (Node 22 + wrangler)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install worker deps
        run: npm install --no-save --no-fund --no-audit

      - name: wrangler version (smoke — confirms it boots under Node 22)
        run: npx wrangler --version

      - name: parse wrangler.toml
        run: npx wrangler deploy --dry-run --outdir=/tmp/wrangler-dryrun
