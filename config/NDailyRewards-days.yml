# NDailyRewards real schema — `rewards.days.<n>` with action prefixes.
# Drop this in place of the existing `days:` block within `rewards:` in
# plugins/NDailyRewards/config.yml.
#
# Action prefixes: [console] [player] [message] [sound] [actionbar] [title]
# [subtitle] [permission] [luck] [close]. Player name placeholder: <player>.
#
# The config.yml lives on the host; this file in the repo is the source of
# truth for "what the days should be" so we can re-apply if NDailyRewards
# regenerates its config in a future update.

  days:
    '1':
      position: 10
      lore:
        - "&7Day 1 — &fStarter"
        - "&8——————————————"
        - "&6$50 &7+ &f4x bread"
      actions:
        - "[console] eco give <player> 50"
        - "[console] give <player> bread 4"
        - "[message] &6+$50 &7and bread to get going. &eDay 1 of 7."
        - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP:1:1"
    '2':
      position: 11
      lore:
        - "&7Day 2 — &fIron Up"
        - "&8——————————————"
        - "&6$100 &7+ &f8x iron ingot"
      actions:
        - "[console] eco give <player> 100"
        - "[console] give <player> iron_ingot 8"
        - "[message] &6+$100 &7and iron. &eDay 2 of 7."
        - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP:1:1"
    '3':
      position: 12
      lore:
        - "&7Day 3 — &aCommon Key"
        - "&8——————————————"
        - "&6$150 &7+ &a1x Common Key"
      actions:
        - "[console] eco give <player> 150"
        - "[console] crates give physical Common 1 <player>"
        - "[message] &6+$150 &7and a &aCommon Crate Key&7. Try /crates!"
        - "[sound] BLOCK_NOTE_BLOCK_PLING:1:1.4"
    '4':
      position: 13
      lore:
        - "&7Day 4 — &bDiamonds"
        - "&8——————————————"
        - "&6$250 &7+ &b4x diamond"
      actions:
        - "[console] eco give <player> 250"
        - "[console] give <player> diamond 4"
        - "[message] &6+$250 &7and 4 diamonds. &eDay 4 of 7."
        - "[sound] BLOCK_AMETHYST_BLOCK_CHIME:1:1"
    '5':
      position: 14
      lore:
        - "&7Day 5 — &bRare Key"
        - "&8——————————————"
        - "&6$400 &7+ &b1x Rare Key"
      actions:
        - "[console] eco give <player> 400"
        - "[console] crates give physical Rare 1 <player>"
        - "[message] &6+$400 &7and a &bRare Crate Key&7."
        - "[sound] BLOCK_BEACON_ACTIVATE:1:1.2"
    '6':
      position: 15
      lore:
        - "&7Day 6 — &dXP Boost"
        - "&8——————————————"
        - "&6$600 &7+ &d32x XP bottle"
      actions:
        - "[console] eco give <player> 600"
        - "[console] give <player> experience_bottle 32"
        - "[message] &6+$600 &7and 32 XP bottles. &eDay 6 of 7."
        - "[sound] ENTITY_PLAYER_LEVELUP:1:1"
    '7':
      position: 16
      lore:
        - "&7Day 7 — &6&lJackpot"
        - "&8——————————————"
        - "&6$1500 &7+ &6&l1x Legendary Key"
      actions:
        - "[console] eco give <player> 1500"
        - "[console] crates give physical Legendary 1 <player>"
        - "[message] &6&l+$1500 &7and a &6&lLegendary Crate Key&7! Streak resets tomorrow."
        - "[sound] UI_TOAST_CHALLENGE_COMPLETE:1:0.8"
