# NDailyRewards real schema — `rewards.days.<n>` with action prefixes.
# Drop this in place of the existing `days:` block within `rewards:` in
# plugins/NDailyRewards/config.yml.
#
# ASCII-only — em-dashes and unicode chars caused a parse error earlier.

  days:
    '1':
      position: 10
      lore:
        - "&7Day 1 - Starter"
        - "&6+50 coins &7and 4x bread"
      actions:
        - "[console] eco give <player> 50"
        - "[console] give <player> bread 4"
        - "[message] &6Day 1 claimed: +50 coins and bread."
        - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP:1:1"
    '2':
      position: 11
      lore:
        - "&7Day 2 - Iron Up"
        - "&6+100 coins &7and 8x iron"
      actions:
        - "[console] eco give <player> 100"
        - "[console] give <player> iron_ingot 8"
        - "[message] &6Day 2 claimed: +100 coins and iron."
        - "[sound] ENTITY_EXPERIENCE_ORB_PICKUP:1:1"
    '3':
      position: 12
      lore:
        - "&7Day 3 - Common Key"
        - "&6+150 coins &7and 1x &aCommon Key"
      actions:
        - "[console] eco give <player> 150"
        - "[console] crates give physical Common 1 <player>"
        - "[message] &6Day 3 claimed: +150 coins and a &aCommon Crate Key&6!"
        - "[sound] BLOCK_NOTE_BLOCK_PLING:1:1.4"
    '4':
      position: 13
      lore:
        - "&7Day 4 - Diamonds"
        - "&6+250 coins &7and 4x diamond"
      actions:
        - "[console] eco give <player> 250"
        - "[console] give <player> diamond 4"
        - "[message] &6Day 4 claimed: +250 coins and 4 diamonds."
        - "[sound] BLOCK_AMETHYST_BLOCK_CHIME:1:1"
    '5':
      position: 14
      lore:
        - "&7Day 5 - Rare Key"
        - "&6+400 coins &7and 1x &bRare Key"
      actions:
        - "[console] eco give <player> 400"
        - "[console] crates give physical Rare 1 <player>"
        - "[message] &6Day 5 claimed: +400 coins and a &bRare Crate Key&6!"
        - "[sound] BLOCK_BEACON_ACTIVATE:1:1.2"
    '6':
      position: 15
      lore:
        - "&7Day 6 - XP Boost"
        - "&6+600 coins &7and 32x XP bottle"
      actions:
        - "[console] eco give <player> 600"
        - "[console] give <player> experience_bottle 32"
        - "[message] &6Day 6 claimed: +600 coins and 32 XP bottles."
        - "[sound] ENTITY_PLAYER_LEVELUP:1:1"
    '7':
      position: 16
      lore:
        - "&6&lDay 7 - JACKPOT"
        - "&6+1500 coins &7and 1x &6&lLegendary Key"
      actions:
        - "[console] eco give <player> 1500"
        - "[console] crates give physical Legendary 1 <player>"
        - "[message] &6&lJACKPOT! +1500 coins and a Legendary Crate Key. Streak resets tomorrow."
        - "[sound] UI_TOAST_CHALLENGE_COMPLETE:1:0.8"
