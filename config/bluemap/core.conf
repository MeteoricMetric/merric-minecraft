# BlueMap 5.16 core config — MeteoricCraft

# Mojang EULA acknowledgment — BlueMap renders client-side block textures
# extracted from the server jar, which requires Mojang EULA acceptance.
accept-download: true

# Render thread count — co-tenant workstation, be polite. 0 = auto.
# 2026-05-08 incident: at 2 threads, BlueMap's first-render starved the
# Paper main thread (watchdog fired, players got "connection reset").
# Dropped to 1 to stay out of the way of game ticks.
render-thread-count: 1

data: "data"
metrics: false

log: {
  file: "logs/debug.log"
  append: false
}
