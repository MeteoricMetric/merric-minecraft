################################################################################
# MeteoricCraft — Minecraft server stack (v1.1)
#
# Services:
#   mc      - Paper 1.21.11 + Geyser/Floodgate + 13-plugin starter pack
#   playit  - playit.gg tunnel agent (TCP/UDP relay, hides home IP)
#
# Usage:
#   cp .env.example .env       (then edit .env with real values)
#   docker compose up -d       (start everything)
#   docker compose logs -f mc  (watch the server boot)
#   docker compose down        (stop)
#
# Documentation:
#   ./MINECRAFT-BUILD-GUIDE.md      — full walkthrough
#   ./docs/RUNBOOK.md               — day-to-day operations
#   ./docs/PLUGIN-GOVERNANCE.md     — what plugins, why, and how they're managed
#   ./docs/CHILD-SAFETY-PRIVACY.md  — what's public, what's private, why
#   ./docs/decisions/               — ADRs for architectural choices
################################################################################

services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: meteoriccraft
    pull_policy: always
    restart: unless-stopped

    # ── Connectivity ──────────────────────────────────────────────────────────
    # Bind to localhost only; playit handles external exposure.
    # If you ever want LAN access too, change to: "25565:25565"
    ports:
      - "127.0.0.1:25565:25565/tcp"   # Java
      - "127.0.0.1:19132:19132/udp"   # Bedrock (Geyser)
      - "127.0.0.1:8100:8100/tcp"     # BlueMap web map
      - "127.0.0.1:25575:25575/tcp"   # RCON (admin) — localhost only, never exposed

    # ── Volumes ───────────────────────────────────────────────────────────────
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro

    # ── Resources ─────────────────────────────────────────────────────────────
    # 5090 rig has plenty; cap to be a polite tenant of its own machine.
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 4G
          cpus: "2.0"

    # ── Process management ────────────────────────────────────────────────────
    init: true
    stdin_open: true
    tty: true
    stop_grace_period: 90s

    # ── Healthcheck ───────────────────────────────────────────────────────────
    # mc-health is bundled in the itzg image; checks via internal RCON.
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 5m
      interval: 30s
      timeout: 10s
      retries: 3

    # ── Environment ───────────────────────────────────────────────────────────
    environment:
      # — Core —
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.11"
      PAPER_CHANNEL: "default"

      # — Memory & JVM (modern Java 21 flag set, NOT legacy Aikar's) —
      # Aikar's flags were tuned for Java 8/11. itzg image now provides
      # USE_MEOWICE_FLAGS, optimized for Java 21+. See ADR-0004 for context.
      MEMORY: "${MEMORY:-6G}"
      USE_MEOWICE_FLAGS: "true"

      # — Identity —
      MOTD: "${MOTD:-§b§lMeteoricCraft §r§7| §fA Strough family server}"
      ICON: "${ICON_URL:-}"
      OVERRIDE_ICON: "true"

      # — Server config —
      MAX_PLAYERS: "${MAX_PLAYERS:-20}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${SIMULATION_DISTANCE:-8}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      MODE: "${MODE:-survival}"
      PVP: "${PVP:-true}"
      ALLOW_FLIGHT: "true"     # required for many movement plugins
      SPAWN_PROTECTION: "16"
      LEVEL_TYPE: "minecraft\\:normal"
      SEED: "${SEED:-}"

      # — Online mode (false because Geyser + Floodgate handle auth) —
      ONLINE_MODE: "false"     # CRITICAL: must be false for Floodgate to work
      ENFORCE_SECURE_PROFILE: "false"

      # — Whitelist (CRITICAL — keep this on) —
      # Per ADR-0010: this is "false" because the public economy-survival
      # format trades whitelist gating for compensating controls (CoreProtect
      # rollback, anti-combat-log, spawn protection, active moderation,
      # Discord adult monitoring). Re-enable IFF those mitigations lapse.
      ENFORCE_WHITELIST: "false"
      WHITELIST: "${WHITELIST}"
      OPS: "${OPS}"

      # — RCON (admin) —
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "25575"

      # — Plugins (the v1.1 starter pack — see docs/PLUGIN-GOVERNANCE.md) ──
      #
      # Source mix:
      #   PLUGINS — direct download URLs (Geyser/Floodgate from GeyserMC's
      #             official CDN; Vault from MilkBowl's GitHub release). Pinned
      #             versions for the security-relevant ones per master §5.
      #   MODRINTH — primary plugin source; auto dependency resolution +
      #              version-compat checks against the running Minecraft version
      #              (PLUGIN-GOVERNANCE.md §3 marks Modrinth as preferred).
      #
      # Why no SPIGET_RESOURCES: api.spiget.org went unreliable on first boot
      # 2026-05-03 (failed to serve resource 9089). Multiverse and DiscordSRV
      # have current Modrinth builds tagged for Paper 1.21.x. EssentialsX is
      # on Modrinth too but its files aren't tagged for 1.21.11 yet — pinned
      # GitHub URL above. Vault is not on Modrinth as the canonical MilkBowl
      # project (only forks like vaultunlocked / vaultplugin) — also pinned.
      # Paper 1.21.11 bundles spark natively; do not install a separate spark
      # plugin or it conflicts with the bundled one (.paper-remapped errors).
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.21.2/EssentialsX-2.21.2.jar

      # Modrinth-sourced plugins (auto-resolve compatible versions).
      # Groups (inline `#` would be parsed as a slug — comment outside the
      # block scalar instead):
      #   1-9: cross-version compat, perms, world tools, web map, multiworld, discord
      #   10-13: economy/progression gameplay (Merric's spec, ADR-0010)
      #   14: visual polish
      MODRINTH_PROJECTS: |
        viaversion
        viabackwards
        luckperms
        worldedit
        worldguard
        chunky
        squaremap
        multiverse-core
        discordsrv
        crazycrates
        quickshop-hikari
        ndailyrewards
        anti_combatlog
        tab-was-taken
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"

      # CoreProtect — anti-grief audit log, MANDATORY per ADR-0010.
      # Not installed via env var: Modrinth's coreprotect entry stops at
      # 1.21.9, Hangar's `download` API blocks programmatic GETs with HTTP 403
      # (JWT auth required), and api.spiget.org is unreliable.
      # Operational install: download CoreProtect-X.Y.Z.jar from
      # https://hangar.papermc.io/CORE/CoreProtect → drop into data/plugins/
      # → restart the mc service. The image picks up loose JARs automatically.

      # — Auto-pause when nobody's online (saves CPU) —
      ENABLE_AUTOPAUSE: "true"
      AUTOPAUSE_TIMEOUT_EST: "3600"   # 1 hour idle before pause
      AUTOPAUSE_TIMEOUT_INIT: "600"   # wait 10 min after start before considering pause

      # — Auto-stop the world if memory issues —
      JVM_OPTS: "-XX:+CrashOnOutOfMemoryError"

      # — Time zone (so logs and backups have correct timestamps) —
      TZ: "${TZ:-America/New_York}"

    networks:
      - mc-net

  # ───────────────────────────────────────────────────────────────────────────
  # playit.gg tunnel agent
  # ───────────────────────────────────────────────────────────────────────────
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: meteoriccraft-tunnel
    restart: unless-stopped

    # Host network so the agent can reach localhost:25565 / 19132
    network_mode: host

    environment:
      SECRET_KEY: "${PLAYIT_SECRET_KEY}"

    depends_on:
      mc:
        condition: service_healthy

# ─────────────────────────────────────────────────────────────────────────────

networks:
  mc-net:
    driver: bridge
